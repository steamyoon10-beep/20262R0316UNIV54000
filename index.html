<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131f" />
    <meta
      name="description"
      content="점프와 숙이기로 장애물을 피하는 감각적인 브라우저 공룡 러너 게임"
    />
    <title>DINO SPRINT — 네온 공룡 러너</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand" aria-label="Dino Sprint">
          <span class="brand-mark" aria-hidden="true">D</span>
          <span>DINO SPRINT</span>
        </div>
        <div class="scoreboard" aria-live="polite">
          <span><small>SCORE</small><strong id="score">00000</strong></span>
          <span><small>BEST</small><strong id="best">00000</strong></span>
        </div>
      </header>

      <section class="game-stage" aria-label="공룡 달리기 게임">
        <canvas id="game" width="1080" height="520" aria-label="게임 화면"></canvas>

        <div class="scanlines" aria-hidden="true"></div>

        <div class="start-panel" id="start-panel">
          <p class="eyebrow">DESERT RUN // 01</p>
          <h1>달려, 작은<br /><em>공룡아.</em></h1>
          <p class="intro">선인장을 넘고 익룡을 피하세요.<br />달릴수록 사막은 빨라집니다.</p>
          <button class="primary-button" id="start-button" type="button">
            <span>게임 시작</span><kbd>SPACE</kbd>
          </button>
        </div>

        <div class="game-over-panel" id="game-over-panel" hidden>
          <p class="eyebrow">RUN COMPLETE</p>
          <h2>아깝다!</h2>
          <p><span id="final-score">0</span>m를 달렸어요.</p>
          <button class="primary-button" id="restart-button" type="button">
            <span>다시 달리기</span><kbd>R</kbd>
          </button>
        </div>

        <button class="sound-button" id="sound-button" type="button" aria-label="소리 끄기">
          <span id="sound-icon" aria-hidden="true">♪</span>
        </button>
      </section>

      <footer class="controls">
        <p><kbd>SPACE</kbd><kbd>↑</kbd><span>점프</span></p>
        <p><kbd>↓</kbd><span>숙이기</span></p>
        <p class="touch-hint">화면을 터치하면 점프합니다</p>
        <p class="status"><i></i> SYSTEM READY</p>
      </footer>
    </main>

    <script src="game.js"></script>
  </body>
</html>
